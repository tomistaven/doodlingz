name: doodlingz
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  equatable: ^2.0.8
  get_it: ^9.2.1
  flex_color_picker: ^3.8.0
  path_provider: ^2.1.5
  shared_preferences: ^2.5.5
  google_fonts: ^8.1.0
  intl: ^0.20.2
  gal: ^2.3.2
  image_picker: ^1.2.2
  material_symbols_icons: ^4.2951.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon_foreground.png

flutter_launcher_icons:
  android: true
  ios: false
  # image_path is the flat fallback icon (pre-Android 8 launchers, etc).
  # Same foreground PNG works here since it already sits on transparency.
  image_path: "assets/icon/icon_foreground.png"
  min_sdk_android: 21
  adaptive_icon_background: "#1A1A1A"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  adaptive_icon_foreground_inset: 28